name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the v (e.g. 0.21.2). The tag is created on main."
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Determine version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Manual releases must be started from main"
              exit 1
            fi
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Invalid version '$version' (expected X.Y.Z)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Check version consistency
        run: |
          manifest=$(python -c "import json; print(json.load(open('custom_components/mcz_maestro/manifest.json'))['version'])")
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::Version $VERSION does not match manifest.json version $manifest"
            exit 1
          fi
          if ! grep -qx "INTEGRATION_VERSION = \"$VERSION\"" custom_components/mcz_maestro/const.py; then
            echo "::error::INTEGRATION_VERSION in const.py does not match $VERSION"
            exit 1
          fi

      - name: Run unit tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v heading="## $VERSION" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No '## $VERSION' section found in CHANGELOG.md"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Creates the tag on the checked-out main commit if it does not exist yet.
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md
          fi
