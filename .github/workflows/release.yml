name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check version consistency
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(python -c "import json; print(json.load(open('custom_components/mcz_maestro/manifest.json'))['version'])")
          if [ "$manifest" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $manifest"
            exit 1
          fi
          if ! grep -qx "INTEGRATION_VERSION = \"$version\"" custom_components/mcz_maestro/const.py; then
            echo "::error::INTEGRATION_VERSION in const.py does not match $version"
            exit 1
          fi

      - name: Run unit tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No '## $version' section found in CHANGELOG.md"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
