name: Release

# Actions > Release > Run workflow : la version est calculée à partir du dernier tag vX.Y.Z,
# appliquée au manifest et à const.py, commitée et taguée, puis publiée en release GitHub (lue par HACS).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Incrément de version
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          last=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          IFS=. read -r ma mi pa <<< "${last:-v0.0.0}"; ma=${ma#v}
          case "$BUMP" in
            major) ma=$((ma+1)); mi=0; pa=0 ;;
            minor) mi=$((mi+1)); pa=0 ;;
            *)     pa=$((pa+1)) ;;
          esac
          echo "VERSION=$ma.$mi.$pa" >> "$GITHUB_ENV"
          echo "TAG=v$ma.$mi.$pa" >> "$GITHUB_ENV"
          echo "${last:-aucun tag} -> v$ma.$mi.$pa"

      - name: Appliquer la version
        run: |
          sed -i -E "s/(\"version\": *\")[^\"]*\"/\1$VERSION\"/" custom_components/mcz_maestro/manifest.json
          sed -i -E "s/^INTEGRATION_VERSION = \".*\"/INTEGRATION_VERSION = \"$VERSION\"/" custom_components/mcz_maestro/const.py

      - name: Commit et tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/mcz_maestro/manifest.json custom_components/mcz_maestro/const.py
          git diff --cached --quiet || git commit -m "Release $TAG"
          git tag "$TAG"
          git push origin "HEAD:$GITHUB_REF_NAME" "$TAG"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
